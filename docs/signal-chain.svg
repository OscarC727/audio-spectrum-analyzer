<svg xmlns="http://www.w3.org/2000/svg" width="1042" height="340" viewBox="0 0 1042 340" role="img" aria-label="Audio spectrum analyzer signal chain">
<title>Audio spectrum analyzer signal chain</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C9A860"/></marker></defs>
<rect width="1042" height="340" rx="14" fill="#0E1626"/>
<text x="28" y="38" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#EADBB0">Audio Spectrum Analyzer: signal chain</text><rect x="28" y="70" width="170" height="64" rx="8" fill="#16213A" stroke="#C9A860" stroke-width="1.5"/><text x="113.0" y="96.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#EADBB0">Microphone</text><text x="113.0" y="116.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9AA6BA">KY-038 style module</text><rect x="242" y="70" width="170" height="64" rx="8" fill="#16213A" stroke="#C9A860" stroke-width="1.5"/><text x="327.0" y="96.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#EADBB0">Teensy 4.0 ADC</text><text x="327.0" y="116.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9AA6BA">samples the audio</text><rect x="456" y="70" width="170" height="64" rx="8" fill="#16213A" stroke="#79C8EE" stroke-width="1.5"/><text x="541.0" y="96.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#EADBB0">FFT</text><text x="541.0" y="116.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9AA6BA">time to frequency</text><rect x="670" y="70" width="150" height="64" rx="8" fill="#16213A" stroke="#C9A860" stroke-width="1.5"/><text x="745.0" y="96.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#EADBB0">Bin + scale</text><text x="745.0" y="116.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9AA6BA">frequency bands</text><rect x="864" y="70" width="150" height="64" rx="8" fill="#16213A" stroke="#C9A860" stroke-width="1.5"/><text x="939.0" y="96.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#EADBB0">ILI9341 TFT</text><text x="939.0" y="116.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9AA6BA">spectrum bars</text><line x1="198" y1="102" x2="242" y2="102" stroke="#C9A860" stroke-width="1.6" marker-end="url(#a)"/><text x="220.0" y="94.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#79C8EE">analog</text><line x1="412" y1="102" x2="456" y2="102" stroke="#C9A860" stroke-width="1.6" marker-end="url(#a)"/><line x1="626" y1="102" x2="670" y2="102" stroke="#C9A860" stroke-width="1.6" marker-end="url(#a)"/><line x1="820" y1="102" x2="864" y2="102" stroke="#C9A860" stroke-width="1.6" marker-end="url(#a)"/><text x="842.0" y="94.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#79C8EE">SPI</text><text x="28" y="176" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#EADBB0">Planned v2 (not built yet)</text><rect x="28" y="192" width="230" height="56" rx="8" fill="#16213A" stroke="#C9A860" stroke-width="1.5"/><text x="143.0" y="214.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#EADBB0">ESP32 controller</text><text x="143.0" y="234.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9AA6BA">knobs, buttons, audio</text><rect x="330" y="192" width="250" height="56" rx="8" fill="#16213A" stroke="#C9A860" stroke-width="1.5"/><text x="455.0" y="214.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#EADBB0">ESP32-S3 5 in display</text><text x="455.0" y="234.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9AA6BA">board 1</text><rect x="330" y="262" width="250" height="56" rx="8" fill="#16213A" stroke="#C9A860" stroke-width="1.5"/><text x="455.0" y="284.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#EADBB0">ESP32-S3 5 in display</text><text x="455.0" y="304.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9AA6BA">board 2</text><line x1="258" y1="220" x2="330" y2="220" stroke="#C9A860" stroke-width="1.6" marker-end="url(#a)"/><text x="294" y="212" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#79C8EE">ESP-NOW</text><path d="M258 232 L294 232 L294 290 L330 290" fill="none" stroke="#C9A860" stroke-width="1.6" marker-end="url(#a)"/><text x="620" y="226" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9AA6BA">Three boards talking over ESP-NOW,</text><text x="620" y="244" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9AA6BA">to get around GPIO limits on one ESP32.</text>
</svg>
